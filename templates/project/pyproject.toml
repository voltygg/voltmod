[project]
name = "$project"
version = "1.0.0"
description = "CS2 plugins built on voltmod"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "voltmod @ git+https://github.com/voltygg/voltmod.git@main",
    "poethepoet>=0.47.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.poe.tasks]
build = "voltmod build"
build-linux = "voltmod build -p linux-steamrt-release"
test = "voltmod test"
install = "voltmod install"
serve = "voltmod serve"
run = "voltmod run"
bootstrap = "voltmod bootstrap"
doctor = "voltmod doctor"
new-plugin = "voltmod new plugin"
format = "voltmod format"

[tool.poe.tasks.lint]
help = "Lint the build tooling and check the plugin source conventions"
sequence = [{ cmd = "ruff check ." }, { cmd = "voltmod lint" }]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
