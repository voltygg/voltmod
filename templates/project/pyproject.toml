[project]
name = "$project"
version = "1.0.0"
description = "CS2 Metamod plugins built on cs2-kit"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    # Brings the poe tasks below plus the pinned CMake/Conan/Ninja/clang-format.
    "cs2-kit @ git+https://github.com/voltygg/cs2-kit.git@v1.0.0",
    "poethepoet>=0.47.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.poe.tasks]
build = "cs2kit build"
build-linux = "cs2kit build linux-steamrt-release"
bootstrap = "cs2kit bootstrap"
new-plugin = "cs2kit new-plugin"
lint = "ruff check ."
format = "cs2kit format"
format-check = "cs2kit format --check"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
