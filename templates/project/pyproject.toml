[project]
name = "$project"
version = "1.0.0"
description = "CS2 Metamod plugins built on voltmod"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    # Brings the poe tasks below plus the pinned CMake/Conan/Ninja/clang-format.
    "voltmod @ git+https://github.com/voltygg/voltmod.git@v1.2.0",
    "poethepoet>=0.47.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.poe.tasks]
build = "voltmod build"
build-linux = "voltmod build linux-steamrt-release"
test = "voltmod test"
install = "voltmod install"
start-server = "voltmod serve"
bootstrap = "voltmod bootstrap"
doctor = "voltmod doctor"
new-plugin = "voltmod new-plugin"
lint = "ruff check ."
format = "voltmod format"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
