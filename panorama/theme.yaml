# The framework's default theme. Copy it to <your repo>/panorama/theme.yaml to override.
# Every dotted path here is a {{token}} a screen stylesheet may substitute.

surface:
  base: "rgba(12, 13, 16, 0.96)"
  raised: "rgba(255, 255, 255, 0.05)"
  sunken: "rgba(0, 0, 0, 0.55)"

primary: "#c8a24a"
secondary: "#8a8778"

text:
  primary: "#e8e6e0"
  secondary: "#8a8778"
  inverse: "#12141a"

hairline: "rgba(200, 162, 74, 0.45)"

fill:
  weak: "rgba(255, 255, 255, 0.05)"
  strong: "rgba(255, 255, 255, 0.12)"
  hover: "rgba(200, 162, 74, 0.22)"
  active: "rgba(200, 162, 74, 0.38)"

status:
  good: "#6fbf73"
  warn: "#d9a441"
  bad: "#d1534a"

rarity:
  common: "#b0c3d9"
  rare: "#4b69ff"
  epic: "#8847ff"
  legendary: "#eb4b4b"

radius:
  small: "2px"
  large: "7px"

motion:
  fast: "0.12s"
  slow: "0.25s"

# One `.Accent--<name>` rule is generated per entry, and an `accent` widget selects between them.
accents:
  - name: neutral
    color: "#8a8778"
  - name: gold
    color: "#c8a24a"
  - name: good
    color: "#6fbf73"
  - name: warn
    color: "#d9a441"
  - name: bad
    color: "#d1534a"
  - name: info
    color: "#4b69ff"
