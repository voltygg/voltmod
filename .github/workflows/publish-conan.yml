name: Publish Conan packages

# Publishes to the private Cloudsmith Conan remote. Secrets: CLOUDSMITH_USERNAME
# (a Cloudsmith user or service-account slug with Write on the repo) and
# CLOUDSMITH_API_KEY (that account's API key - entitlement tokens are read-only).
# cs2-kit publishes on every v* tag; the SDK packages only via manual dispatch,
# after a PR moves recipes/*/conandata.yml, conanfile.py's version constants and
# the vendor/ submodules together.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_sdks:
        description: "Also build + upload hl2sdk-cs2 and metamod-source"
        type: boolean
        default: false

env:
  # Cloudsmith Conan repo, e.g. https://conan.cloudsmith.io/<org>/<repo>/
  CONAN_REMOTE_URL: https://conan.cloudsmith.io/voltygg/cs2-kit/
  HL2SDK_VERSION: "2026.07.23"
  METAMOD_VERSION: "2.0.0.20260711"

jobs:
  linux:
    name: Build + upload (linux-steamrt)
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      # Non-recursive: the SDK recipes fetch their pinned upstream commits themselves.
      - uses: actions/checkout@v7

      # The sniper image ships neither pip nor a C++23 compiler; gcc-14 lives in
      # sniper_beta, as deploy/Dockerfile in cs2-plugins already does.
      - name: Bootstrap the SteamRT container
        run: |
          echo 'deb https://repo.steampowered.com/steamrt3/apt sniper_beta main contrib non-free' > /etc/apt/sources.list.d/steamrt-beta.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates gcc-14-monolithic git ninja-build python3-pip
          rm -rf /var/lib/apt/lists/*

      - name: Install conan
        run: python3 -m pip install --no-cache-dir "conan>=2.29.1" "cmake>=4.3.4" "ninja>=1.13.0"

      - name: Configure remote
        run: |
          conan profile detect --force >/dev/null 2>&1 || true
          conan remote add voltygg "$CONAN_REMOTE_URL"
          conan remote login voltygg "${{ secrets.CLOUDSMITH_USERNAME }}" -p "${{ secrets.CLOUDSMITH_API_KEY }}"

      - name: Build SDK packages
        if: github.event_name == 'workflow_dispatch' && inputs.publish_sdks
        run: |
          conan create recipes/metamod-source --version "$METAMOD_VERSION" \
            -pr:a conan/profiles/linux-steamrt.txt -s build_type=Release
          conan create recipes/hl2sdk-cs2 --version "$HL2SDK_VERSION" \
            -pr:a conan/profiles/linux-steamrt.txt -s build_type=Release

      - name: Build cs2-kit (Release + Debug, with/without postgres)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CS2KIT_VERSION: ${{ github.ref_name }}
        run: |
          export CS2KIT_VERSION="${CS2KIT_VERSION#v}"
          # --lockfile="": conan.lock pins the vendored-dev graph, not the SDK packages.
          for bt in Release Debug; do
            for pg in False True; do
              conan create . -pr:a conan/profiles/linux-steamrt.txt \
                -s build_type=$bt -o "cs2-kit/*:with_postgres=$pg" --build=missing --lockfile=""
            done
          done

      - name: Upload everything (recipes + binaries, incl. third-party deps)
        run: conan upload "*" -r voltygg --confirm

  windows:
    name: Build + upload (windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install conan
        run: python -m pip install "conan>=2.29.1" "cmake>=4.3.4" "ninja>=1.13.0"

      - name: Configure remote
        run: |
          conan profile detect --force 2>$null; if (-not $?) { }
          conan remote add voltygg "$env:CONAN_REMOTE_URL"
          conan remote login voltygg "${{ secrets.CLOUDSMITH_USERNAME }}" -p "${{ secrets.CLOUDSMITH_API_KEY }}"

      # windows-latest ships cl 19.4x but the checked-in profile says 195; pass the
      # runner's version so package IDs match what newer consumers resolve.
      - name: Detect MSVC version
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          # -find lists every installed toolset ascending, so take the last: a VS2022 image
          # also carries the 14.29 (cl 19.2x) toolset, which cannot compile C++23.
          $cl = & $vswhere -latest -products * -find "VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" | Sort-Object | Select-Object -Last 1
          if (-not $cl) { throw "no cl.exe found" }
          if ((& $cl 2>&1 | Out-String) -notmatch "Version (\d+)\.(\d+)") { throw "could not parse cl version" }
          $msvc = "$($Matches[1])$($Matches[2].Substring(0,1))"
          if ([int]$msvc -lt 193) { throw "cl $msvc predates C++23 support" }
          "version=$msvc" >> $env:GITHUB_OUTPUT

      - name: Build SDK packages
        if: github.event_name == 'workflow_dispatch' && inputs.publish_sdks
        shell: pwsh
        run: |
          conan create recipes/metamod-source --version "$env:METAMOD_VERSION" -pr:a conan/profiles/windows-msvc.txt -s compiler.version=${{ steps.msvc.outputs.version }} -s build_type=Release -s compiler.runtime_type=Release
          conan create recipes/hl2sdk-cs2 --version "$env:HL2SDK_VERSION" -pr:a conan/profiles/windows-msvc.txt -s compiler.version=${{ steps.msvc.outputs.version }} -s build_type=Release -s compiler.runtime_type=Release

      - name: Build cs2-kit (Release + Debug, with/without postgres)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          CS2KIT_VERSION: ${{ github.ref_name }}
        run: |
          $env:CS2KIT_VERSION = $env:CS2KIT_VERSION -replace '^v', ''
          foreach ($bt in "Release", "Debug") {
            foreach ($pg in "False", "True") {
              conan create . -pr:a conan/profiles/windows-msvc.txt -s compiler.version=${{ steps.msvc.outputs.version }} -s build_type=$bt -s compiler.runtime_type=$bt -o "cs2-kit/*:with_postgres=$pg" --build=missing --lockfile=""
              if ($LASTEXITCODE -ne 0) { exit 1 }
            }
          }

      - name: Upload everything (recipes + binaries, incl. third-party deps)
        run: conan upload "*" -r voltygg --confirm

  smoke:
    name: Consume from the remote (no submodules)
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install conan
        run: python -m pip install "conan>=2.29.1" "cmake>=4.3.4" "ninja>=1.13.0"

      - name: Fresh consume of cs2-kit from the remote
        shell: bash
        env:
          CONAN_HOME: ${{ runner.temp }}/conan-fresh
        run: |
          conan profile detect --force >/dev/null 2>&1 || true
          conan remote add voltygg "$CONAN_REMOTE_URL"
          conan remote login voltygg "${{ secrets.CLOUDSMITH_USERNAME }}" -p "${{ secrets.CLOUDSMITH_API_KEY }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PROFILE=conan/profiles/windows-msvc.txt
            EXTRA="-s compiler.runtime_type=Release -s compiler.version=194"
          else
            PROFILE=conan/profiles/linux-steamrt.txt
            EXTRA=""
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # test_package doubles as the smoke consumer: everything from the remote.
          conan test test_package "cs2-kit/$VERSION" -pr:a "$PROFILE" \
            -s build_type=Release $EXTRA -r voltygg --build=never
