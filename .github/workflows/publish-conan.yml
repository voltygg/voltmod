name: Publish cs2-kit

# Publishes cs2-kit to the public Cloudsmith Conan remote on every v* tag. The SDK
# packages have their own repo (voltygg/cs2-sdk-recipes) and publish from there.
#
# Only Linux Release is uploaded - it is the deploy target, and a Windows cs2-kit.lib
# is ~200 MB of embedded CodeView. Windows consumers get the recipe and build locally
# via --build=missing, which the windows job below proves still works.
#
# Secrets: CLOUDSMITH_USERNAME (an account with Write on the repo) and
# CLOUDSMITH_API_KEY (that account's API key - entitlement tokens are read-only).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CONAN_REMOTE_URL: https://conan.cloudsmith.io/voltygg/cs2-kit/

jobs:
  linux:
    name: Build + upload (linux-steamrt Release)
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7

      # The sniper image ships neither pip nor a C++23 compiler; gcc-14 lives in
      # sniper_beta, as deploy/Dockerfile in cs2-plugins already does.
      - name: Bootstrap the SteamRT container
        run: |
          echo 'deb https://repo.steampowered.com/steamrt3/apt sniper_beta main contrib non-free' > /etc/apt/sources.list.d/steamrt-beta.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates gcc-14-monolithic git ninja-build python3-pip
          rm -rf /var/lib/apt/lists/*

      - name: Install conan
        run: python3 -m pip install --no-cache-dir "conan>=2.29.1" "cmake>=4.3.4" "ninja>=1.13.0"

      - name: Configure remote
        run: |
          conan profile detect --force >/dev/null 2>&1 || true
          conan remote add voltygg "$CONAN_REMOTE_URL"
          conan remote login voltygg "${{ secrets.CLOUDSMITH_USERNAME }}" -p "${{ secrets.CLOUDSMITH_API_KEY }}"

      - name: Build cs2-kit (with and without postgres)
        env:
          CS2KIT_VERSION: ${{ github.ref_name }}
        run: |
          export CS2KIT_VERSION="${CS2KIT_VERSION#v}"
          # --build=!<sdk>: a missing SDK binary means the recipes repo never
          # published, and building it here starts a multi-GB fetch that fails anyway.
          for pg in False True; do
            conan create . -pr:a conan/profiles/linux-steamrt.txt \
              -s build_type=Release -o "cs2-kit/*:with_postgres=$pg" \
              --build=missing '--build=!hl2sdk-cs2/*' '--build=!metamod-source/*'
          done

      # Ours only. Third-party deps come from conancenter; re-uploading them costs
      # hundreds of MB a run and buys nothing.
      - name: Upload
        run: |
          conan upload "cs2-kit/*" -r voltygg --confirm \
            -cc core.upload:retry=3 -cc core.upload:retry_wait=10

  windows:
    name: Verify (windows-msvc Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install conan
        run: python -m pip install "conan>=2.29.1" "cmake>=4.3.4" "ninja>=1.13.0"

      - name: Configure remote
        run: |
          conan profile detect --force 2>$null; if (-not $?) { }
          conan remote add voltygg "$env:CONAN_REMOTE_URL"

      # windows-latest ships cl 19.4x but the checked-in profile says 195; pass the
      # runner's version so package IDs match what newer consumers resolve.
      - name: Detect MSVC version
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          # -find lists every installed toolset ascending, so take the last: a VS2022 image
          # also carries the 14.29 (cl 19.2x) toolset, which cannot compile C++23.
          $cl = & $vswhere -latest -products * -find "VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" | Sort-Object | Select-Object -Last 1
          if (-not $cl) { throw "no cl.exe found" }
          if ((& $cl 2>&1 | Out-String) -notmatch "Version (\d+)\.(\d+)") { throw "could not parse cl version" }
          $msvc = "$($Matches[1])$($Matches[2].Substring(0,1))"
          if ([int]$msvc -lt 193) { throw "cl $msvc predates C++23 support" }
          "version=$msvc" >> $env:GITHUB_OUTPUT

      - name: Build cs2-kit from the published recipe inputs
        shell: pwsh
        env:
          CS2KIT_VERSION: ${{ github.ref_name }}
        run: |
          $env:CS2KIT_VERSION = $env:CS2KIT_VERSION -replace '^v', ''
          conan create . -pr:a conan/profiles/windows-msvc.txt `
            -s compiler.version=${{ steps.msvc.outputs.version }} `
            -s build_type=Release -s compiler.runtime_type=Release `
            -o "cs2-kit/*:with_postgres=True" `
            --build=missing "--build=!hl2sdk-cs2/*" "--build=!metamod-source/*"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  smoke:
    name: Consume from the remote (anonymous)
    needs: [linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap the SteamRT container
        run: |
          echo 'deb https://repo.steampowered.com/steamrt3/apt sniper_beta main contrib non-free' > /etc/apt/sources.list.d/steamrt-beta.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates gcc-14-monolithic git ninja-build python3-pip
          rm -rf /var/lib/apt/lists/*

      - name: Install conan
        run: python3 -m pip install --no-cache-dir "conan>=2.29.1" "cmake>=4.3.4" "ninja>=1.13.0"

      # No login: the remote is public. That is the property under test.
      - name: Fresh consume of cs2-kit from the remote
        env:
          CONAN_HOME: ${{ runner.temp }}/conan-fresh
        run: |
          conan profile detect --force >/dev/null 2>&1 || true
          conan remote add voltygg "$CONAN_REMOTE_URL"
          # test_package doubles as the smoke consumer: every input from the remote.
          conan test test_package "cs2-kit/${GITHUB_REF_NAME#v}" \
            -pr:a conan/profiles/linux-steamrt.txt -s build_type=Release \
            -r voltygg --build=never
