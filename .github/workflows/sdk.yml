# Secrets:
#   CLOUDSMITH_USERNAME, CLOUDSMITH_API_KEY  a Cloudsmith account that can upload packages

name: SDK packages

# Only a recipe change rebuilds the SDKs; CI otherwise uses the binaries conan.lock pins.

on:
  pull_request:
    paths: ["recipes/**"]
  push:
    branches: [main]
    paths: ["recipes/**"]
  workflow_dispatch:

concurrency:
  group: sdk-${{ github.ref }}
  # Never cancel an upload half way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: Build the SDK packages and the framework
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      - name: Build the SDK packages, publishing outside a pull request
        run: python -m tools.release ${{ github.event_name == 'pull_request' && 'build' || 'publish' }} sdk

      # The lockfile pins the published SDK revisions, not the ones built here.
      - name: Rebuild the framework against them
        run: python -m tools.release build framework --no-lockfile

  tag:
    name: Tag the SDK versions
    needs: sdk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Tag each pinned version
        run: python -m tools.release tag
