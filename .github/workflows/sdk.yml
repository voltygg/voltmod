name: SDK packages

# A recipe change is the only reason to rebuild the SDKs; CI otherwise uses the binaries the
# lockfile pins. A pull request builds them; main publishes and tags them.

on:
  pull_request:
    paths: ["recipes/**"]
  push:
    branches: [main]
    paths: ["recipes/**"]
  workflow_dispatch:

concurrency:
  group: sdk-${{ github.ref }}
  # An upload is never cancelled half way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: Build the SDK packages and the framework
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      - name: Build the SDK packages, uploading them outside a pull request
        run: python -m tools.release ${{ github.event_name == 'pull_request' && 'build' || 'publish' }} sdk

      # Without the lockfile: it pins the published SDK revisions, not the ones built here.
      - name: Rebuild the framework against them
        run: python -m tools.release build framework --no-lockfile --database on

  tag:
    name: Tag the SDK versions
    needs: sdk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          cache: "false"
      - name: Tag each pinned version
        run: python -m tools.release tag
