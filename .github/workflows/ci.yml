name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and module layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv run poe lint

  build:
    name: Build and test (linux-steamrt)
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      # Not `conan create`: its cache build leaves out tests/ and forces BUILD_TESTING off.
      - name: Build
        run: voltmod build -p linux-steamrt-release

      - name: Test
        run: voltmod test -p linux-steamrt-release
