name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and module layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Ruff
        run: uv run poe lint

      - name: Check the module layering
        run: uv run poe modgraph

  # Both jobs below compile the framework, against the SDK binaries the lockfile pins, so they run
  # side by side rather than one after another.
  build:
    name: Build and test (linux-steamrt)
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      # `conan create` cannot run the suite: tests/ is outside exports_sources, and a cache build
      # forces BUILD_TESTING off.
      - name: Build the framework from source, with tests
        run: voltmod build linux-steamrt-release

      - name: Run the test suite
        run: voltmod test linux-steamrt-release

  package:
    name: Conan package (database=${{ matrix.database }})
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    strategy:
      fail-fast: false
      matrix:
        database: ["off", "on"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      - name: Create the Conan package
        run: voltmod package build framework --database ${{ matrix.database }}
