name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and module graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Ruff
        run: uv run poe lint


      - name: Module layering holds
        run: uv run poe modgraph

  build:
    name: Build and test (linux-steamrt)
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Build the SDK packages
        run: voltmod package build sdk

      # `conan create` cannot run these: tests/ is outside exports_sources and the recipe forces
      # BUILD_TESTING off for a cache build, so the suite needs a source-checkout build of its own.
      - name: Build the framework from source, with tests
        run: voltmod build linux-steamrt-release --no-lockfile

      - name: Run the test suite
        run: voltmod test linux-steamrt-release

      - name: Build voltmod against them
        run: voltmod package build kit --no-lockfile
