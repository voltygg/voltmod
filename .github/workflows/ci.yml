name: CI

# Cheap checks that need no compiler. The expensive one - does the kit still build
# against the current SDK - lives in voltygg/cs2-sdk-recipes, which runs it on every
# recipe bump as well.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, module graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Ruff
        run: uv run poe lint

      - name: clang-format
        run: uv run poe format-check

      # The layering is load-bearing: a cycle here means the Conan components can no
      # longer be declared, and nothing else would notice until a consumer's link fails.
      - name: Module graph is a DAG
        run: uv run poe modgraph
