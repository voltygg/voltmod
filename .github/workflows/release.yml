name: Release

# A v* tag publishes voltmod. A manual run builds the same package without uploading, to check a
# commit before it is tagged. SDK packages are published by sdk.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Release voltmod
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      - name: Build voltmod
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: python -m tools.release build framework --no-lockfile

      - name: Build and upload voltmod
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: python -m tools.release publish framework --no-lockfile

  # Only once the package is on the remote, so a GitHub release never announces a missing package.
  github-release:
    name: GitHub release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v heading="## ${TAG#v} " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
