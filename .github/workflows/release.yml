name: Release

# A v* tag publishes voltmod. A manual run builds the same packages without uploading, to check a
# commit before it is tagged. SDK packages are published by sdk.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # One job per variant: each is a full compile, and they share no work.
  release:
    name: Release voltmod (database=${{ matrix.database }})
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    strategy:
      fail-fast: false
      matrix:
        database: ["off", "on"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      - name: Build voltmod
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: python -m tools.release build framework --no-lockfile --database ${{ matrix.database }}

      - name: Build and upload voltmod
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: python -m tools.release publish framework --no-lockfile --database ${{ matrix.database }}
