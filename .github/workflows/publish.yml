name: Publish

# Recipe changes publish SDK packages; v* tags publish Voltmod.

on:
  push:
    branches: [main]
    paths: ["recipes/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sdk:
    name: SDK packages (linux-steamrt)
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      - name: Build and upload the SDK packages
        run: python -m tools.release publish sdk

      - name: Rebuild the framework against them
        run: python -m tools.release build framework --no-lockfile --database on

  tag:
    name: Tag the SDK versions
    needs: sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          cache: "false"
      - name: Tag each pinned version
        run: python -m tools.release tag

  # Only with_database=True is prebuilt; consumers of the other variant build it from source.
  release:
    name: Release voltmod
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      - name: Build and upload voltmod
        run: python -m tools.release publish framework --no-lockfile --database on

  verify-download:
    name: Install from the remote as a consumer
    needs: [release]
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          cache: "false"

      - name: Build the test package against the uploaded binaries
        env:
          CONAN_HOME: ${{ runner.temp }}/conan-fresh
        run: |
          version="$(python -m tools.release version)"
          conan profile detect --force >/dev/null 2>&1 || true
          conan config install ./conan
          conan test test_package "voltmod/$version" \
            -pr:a conan/profiles/linux-steamrt.txt -s build_type=Release \
            -o 'voltmod/*:with_database=True' \
            --build=missing '--build=!voltmod/*' \
            '--build=!hl2sdk-cs2/*' '--build=!metamod-source/*'
