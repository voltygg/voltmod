name: Publish

# Two release paths into the same public Cloudsmith remote:
#
#   push to main touching recipes/**  ->  the SDK packages, then a rebuilt cs2-kit so a
#                                         consumer resolving the new SDK finds a binary
#   v* tag                            ->  cs2-kit itself
#
# The SDK path used to be a separate repo, which is why it needed a cross-checkout and a
# "pin cs2-kit to its newest release" dance to avoid building an untagged tip. Both halves
# now build the working tree, and `cs2kit package publish` refuses a v* tag that disagrees
# with version.txt.
#
# Secrets: CLOUDSMITH_USERNAME (an account with Write on the repo) and CLOUDSMITH_API_KEY
# (that account's API key - entitlement tokens are read-only).

on:
  push:
    branches: [main]
    paths: ["recipes/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sdk:
    name: SDK packages (${{ matrix.name }})
    if: "!startsWith(github.ref, 'refs/tags/')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-steamrt
            os: ubuntu-latest
            container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
          - name: windows-msvc
            os: windows-latest
            container: ""
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    env:
      CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Build and upload the SDK packages
        run: cs2kit package publish sdk

      # Linux only: it is the deploy target, and a Windows Release cs2-kit.lib is ~208 MB
      # of embedded CodeView. Windows and Debug consumers build the kit themselves.
      - name: Rebuild cs2-kit against them
        if: runner.os == 'Linux'
        run: cs2kit package publish kit --no-lockfile

  tag:
    name: Tag the SDK versions
    needs: sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag each pinned version
        run: python3 -m pip install --no-cache-dir . && cs2kit package tag

  kit:
    name: Release cs2-kit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Build and upload cs2-kit
        run: cs2kit package publish kit

  smoke:
    name: Consume from the remote (anonymous)
    needs: [kit]
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      # No login. That the remote serves anonymously is the property under test, and it
      # is the one thing a publishing job cannot check about itself.
      - name: Fresh consume of cs2-kit from the remote
        env:
          CONAN_HOME: ${{ runner.temp }}/conan-fresh
        run: |
          conan profile detect --force >/dev/null 2>&1 || true
          conan config install ./conan
          # --build=!<ours>: only cs2-kit and the SDKs are claimed to be prebuilt. Conan
          # Center has no binaries for the gcc-14 / old-libstdc++-ABI profile, so cpr and
          # friends legitimately compile here.
          conan test test_package "cs2-kit/$(cat version.txt)" \
            -pr:a conan/profiles/linux-steamrt.txt -s build_type=Release \
            --build=missing '--build=!cs2-kit/*' \
            '--build=!hl2sdk-cs2/*' '--build=!metamod-source/*'
