name: Publish

# Recipe changes publish SDK packages; v* tags publish Voltmod.

on:
  push:
    branches: [main]
    paths: ["recipes/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sdk:
    name: SDK packages (linux-steamrt)
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Build and upload the SDK packages
        run: voltmod package publish sdk

      - name: Rebuild voltmod against them
        run: voltmod package build kit --no-lockfile

  tag:
    name: Tag the SDK versions
    needs: sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Tag each pinned version
        run: voltmod package tag

  kit:
    name: Release voltmod
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Build and upload voltmod
        run: voltmod package publish kit --no-lockfile

  smoke:
    name: Consume from the remote (anonymous)
    needs: [kit]
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      - name: Fresh consume of voltmod from the remote
        env:
          CONAN_HOME: ${{ runner.temp }}/conan-fresh
        run: |
          version="$(voltmod package version)"
          conan profile detect --force >/dev/null 2>&1 || true
          conan config install ./conan
          conan test test_package "voltmod/$version" \
            -pr:a conan/profiles/linux-steamrt.txt -s build_type=Release \
            --build=missing '--build=!voltmod/*' \
            '--build=!hl2sdk-cs2/*' '--build=!metamod-source/*'
