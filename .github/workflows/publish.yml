name: Publish

# Recipe changes publish SDK packages; v* tags publish Voltmod.

on:
  push:
    branches: [main]
    paths: ["recipes/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sdk:
    name: SDK packages (linux-steamrt)
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      - name: Build and upload the SDK packages
        run: voltmod package publish sdk

      - name: Rebuild the framework against them
        run: voltmod package build framework --no-lockfile

  tag:
    name: Tag the SDK versions
    needs: sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          cache: "false"
      - name: Tag each pinned version
        run: voltmod package tag

  # One job per variant: each is a full compile, and they share no work.
  release:
    name: Release voltmod (database=${{ matrix.database }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    strategy:
      fail-fast: false
      matrix:
        database: ["off", "on"]
    env:
      CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      - name: Build and upload voltmod
        run: voltmod package publish framework --no-lockfile --database ${{ matrix.database }}

  verify-download:
    name: Install from the remote as a consumer
    needs: [release]
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          cache: "false"

      - name: Build the test package against the uploaded binaries
        env:
          CONAN_HOME: ${{ runner.temp }}/conan-fresh
        run: |
          version="$(voltmod package version)"
          conan profile detect --force >/dev/null 2>&1 || true
          conan config install ./conan
          conan test test_package "voltmod/$version" \
            -pr:a conan/profiles/linux-steamrt.txt -s build_type=Release \
            --build=missing '--build=!voltmod/*' \
            '--build=!hl2sdk-cs2/*' '--build=!metamod-source/*'
