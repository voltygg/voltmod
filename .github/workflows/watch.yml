name: Watch upstream

# Opens or updates one PR for upstream SDK revisions.

on:
  schedule:
    - cron: "0 6 * * *"  # watch, daily
    - cron: "0 4 * * 0"  # prune, weekly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    if: github.event.schedule != '0 4 * * 0'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # An app identity, not GITHUB_TOKEN: Actions refuses to open a PR with it, and events it
      # signs never start another workflow, so CI would skip the PR and every later push to it.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup-toolchain

      - name: Resolve the upstream tips
        id: watch
        run: python -m tools.release watch

      - name: Open or update the PR
        if: steps.watch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch=bot/sdk-pins
          title="chore(sdk): follow upstream"
          bot="${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.name "$bot"
          git config user.email "$bot@users.noreply.github.com"
          git checkout -B "$branch"
          git add recipes/*/conandata.yml
          git commit -m "$title"
          git push --force origin "$branch"
          body=$(git show --stat --format= HEAD)
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --head "$branch" --title "$title" --body "$body"
          fi

  prune:
    name: Prune superseded artifacts
    runs-on: ubuntu-latest
    if: github.event.schedule != '0 6 * * *'
    env:
      CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Prune
        run: python -m tools.release prune --keep 3
