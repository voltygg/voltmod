# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Set up the voltmod toolchain
description: Install build tools, Voltmod, and the canonical Conan configuration.

inputs:
  voltmod-source:
    description: Package source to install; @action uses this action's checkout
    required: false
    default: "."
  conan-source:
    description: Repository root containing conan; @action uses this action's checkout
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Bootstrap the SteamRT container
      if: runner.os == 'Linux'
      shell: bash
      run: |
        grep -q steamrt /etc/os-release || exit 0
        echo 'deb https://repo.steampowered.com/steamrt3/apt sniper_beta main contrib non-free' \
          > /etc/apt/sources.list.d/steamrt-beta.list
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates ccache gcc-14-monolithic git ninja-build
        rm -rf /var/lib/apt/lists/*

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0

    - name: Install voltmod (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        VOLTMOD_SOURCE: ${{ inputs.voltmod-source }}
      run: |
        if [ "$VOLTMOD_SOURCE" = "@action" ]; then
          VOLTMOD_SOURCE="$GITHUB_ACTION_PATH/../../.."
        fi
        uv venv --python 3.14 "$RUNNER_TEMP/voltmod"
        uv pip install --python "$RUNNER_TEMP/voltmod/bin/python" --no-cache "$VOLTMOD_SOURCE"
        echo "$RUNNER_TEMP/voltmod/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$RUNNER_TEMP/voltmod" >> "$GITHUB_ENV"

    - name: Install voltmod (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VOLTMOD_SOURCE: ${{ inputs.voltmod-source }}
      run: |
        if ($env:VOLTMOD_SOURCE -eq "@action") {
          $env:VOLTMOD_SOURCE = "$env:GITHUB_ACTION_PATH\..\..\.."
        }
        uv venv --python 3.14 "$env:RUNNER_TEMP\voltmod"
        uv pip install --python "$env:RUNNER_TEMP\voltmod\Scripts\python.exe" --no-cache "$env:VOLTMOD_SOURCE"
        Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\voltmod\Scripts"
        Add-Content -Path $env:GITHUB_ENV -Value "VIRTUAL_ENV=$env:RUNNER_TEMP\voltmod"

    - name: Install the canonical Conan profiles and remotes
      shell: bash
      env:
        CONAN_SOURCE: ${{ inputs.conan-source }}
      run: |
        if [ "$CONAN_SOURCE" = "@action" ]; then
          CONAN_SOURCE="$GITHUB_ACTION_PATH/../../.."
        fi
        conan profile detect --force >/dev/null 2>&1 || true
        conan config install "$CONAN_SOURCE" -sf conan
