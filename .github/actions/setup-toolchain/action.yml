# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Set up the voltmod toolchain
description: Install voltmod and its Conan configuration from this action's repository; in the steamrt container, also the compiler and the build caches.

runs:
  using: composite
  steps:
    # Only the steamrt container compiles, so a plain runner skips this and the caches.
    - name: Install the compiler and build tools
      id: compiler
      shell: bash
      run: |
        grep -q steamrt /etc/os-release || exit 0
        echo 'deb https://repo.steampowered.com/steamrt3/apt sniper_beta main contrib non-free' \
          > /etc/apt/sources.list.d/steamrt-beta.list
        apt-get -o Acquire::Check-Valid-Until=false update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates ccache gcc-14-monolithic git ninja-build zstd
        rm -rf /var/lib/apt/lists/*
        echo "steamrt=true" >> "$GITHUB_OUTPUT"
        {
          echo "CONAN_HOME=$HOME/.conan2"
          echo "CCACHE_DIR=$HOME/.cache/ccache"
          echo "CCACHE_MAXSIZE=2G"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,locale,include_file_ctime,include_file_mtime"
          # Conan builds every package id under its own path, so the path stays out of the hash.
          echo "CCACHE_BASEDIR=/"
          echo "CCACHE_NOHASHDIR=1"
        } >> "$GITHUB_ENV"

    - uses: astral-sh/setup-uv@v10.1.0

    - name: Install voltmod and its Conan configuration
      shell: bash
      run: |
        root="$GITHUB_ACTION_PATH/../../.."
        venv="$RUNNER_TEMP/voltmod"
        uv venv --python 3.14 "$venv"
        uv pip install --python "$venv/bin/python" --no-cache "$root"
        export PATH="$venv/bin:$PATH"
        conan profile detect --force >/dev/null 2>&1 || true
        conan config install "$root" -sf conan
        echo "$venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"

    # Per-job keys (options differ); a tag push only restores, since a tag's cache is visible to that tag alone.
    - name: Cache the dependency binaries
      if: steps.compiler.outputs.steamrt == 'true' && github.ref_type != 'tag'
      uses: actions/cache@v6
      with:
        path: |
          ${{ env.CONAN_HOME }}/p
          !${{ env.CONAN_HOME }}/p/b
        key: conan-${{ runner.os }}-${{ github.job }}-${{ hashFiles('conan.lock', 'conanfile.py', 'recipes/**/conandata.yml', 'conan/profiles/*') }}
        restore-keys: |
          conan-${{ runner.os }}-${{ github.job }}-
          conan-${{ runner.os }}-

    - name: Restore the dependency binaries
      if: steps.compiler.outputs.steamrt == 'true' && github.ref_type == 'tag'
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ env.CONAN_HOME }}/p
          !${{ env.CONAN_HOME }}/p/b
        key: conan-${{ runner.os }}-${{ github.job }}-
        restore-keys: conan-${{ runner.os }}-

    - name: Cache the compiled objects
      if: steps.compiler.outputs.steamrt == 'true' && github.ref_type != 'tag'
      uses: actions/cache@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ github.job }}-
          ccache-${{ runner.os }}-

    - name: Restore the compiled objects
      if: steps.compiler.outputs.steamrt == 'true' && github.ref_type == 'tag'
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ github.job }}-
        restore-keys: ccache-${{ runner.os }}-
