# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Set up the voltmod toolchain
description: Install build tools, Voltmod, the canonical Conan configuration, and the build caches.

inputs:
  voltmod-source:
    description: Package source to install; @action uses this action's checkout
    required: false
    default: "."
  conan-source:
    description: Repository root containing conan; @action uses this action's checkout
    required: false
    default: "."
  cache:
    description: Keep the build caches between runs; off for a job that compiles nothing
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install the container's compiler and build tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        grep -q steamrt /etc/os-release || exit 0
        echo 'deb https://repo.steampowered.com/steamrt3/apt sniper_beta main contrib non-free' \
          > /etc/apt/sources.list.d/steamrt-beta.list
        apt-get -o Acquire::Check-Valid-Until=false update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates ccache gcc-14-monolithic git ninja-build
        rm -rf /var/lib/apt/lists/*

    - name: Install uv
      uses: astral-sh/setup-uv@v10

    - name: Install voltmod (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        VOLTMOD_SOURCE: ${{ inputs.voltmod-source }}
      run: |
        if [ "$VOLTMOD_SOURCE" = "@action" ]; then
          VOLTMOD_SOURCE="$GITHUB_ACTION_PATH/../../.."
        fi
        uv venv --python 3.14 "$RUNNER_TEMP/voltmod"
        uv pip install --python "$RUNNER_TEMP/voltmod/bin/python" --no-cache "$VOLTMOD_SOURCE"
        echo "$RUNNER_TEMP/voltmod/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$RUNNER_TEMP/voltmod" >> "$GITHUB_ENV"

    - name: Install voltmod (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VOLTMOD_SOURCE: ${{ inputs.voltmod-source }}
      run: |
        if ($env:VOLTMOD_SOURCE -eq "@action") {
          $env:VOLTMOD_SOURCE = "$env:GITHUB_ACTION_PATH\..\..\.."
        }
        uv venv --python 3.14 "$env:RUNNER_TEMP\voltmod"
        uv pip install --python "$env:RUNNER_TEMP\voltmod\Scripts\python.exe" --no-cache "$env:VOLTMOD_SOURCE"
        Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\voltmod\Scripts"
        Add-Content -Path $env:GITHUB_ENV -Value "VIRTUAL_ENV=$env:RUNNER_TEMP\voltmod"

    - name: Install the canonical Conan profiles and remotes
      shell: bash
      env:
        CONAN_SOURCE: ${{ inputs.conan-source }}
      run: |
        if [ "$CONAN_SOURCE" = "@action" ]; then
          CONAN_SOURCE="$GITHUB_ACTION_PATH/../../.."
        fi
        conan profile detect --force >/dev/null 2>&1 || true
        conan config install "$CONAN_SOURCE" -sf conan

    - name: Resolve the cache paths
      shell: bash
      run: |
        {
          echo "CONAN_HOME=${CONAN_HOME:-$HOME/.conan2}"
          echo "CCACHE_DIR=${CCACHE_DIR:-$HOME/.cache/ccache}"
          echo "CCACHE_MAXSIZE=2G"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,locale,include_file_ctime,include_file_mtime"
          # Conan builds every package id under its own path, so the path stays out of the hash.
          echo "CCACHE_BASEDIR=/"
          echo "CCACHE_NOHASHDIR=1"
        } >> "$GITHUB_ENV"

    # Nothing in the dependency closure has a prebuilt binary for this toolchain - gcc-14 with the
    # SDK's old libstdc++ ABI - so an uncached job spends five minutes on OpenSSL and libpq first.
    - name: Cache the dependency binaries
      if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ${{ env.CONAN_HOME }}/p
          !${{ env.CONAN_HOME }}/p/b
        key: conan-${{ runner.os }}-${{ hashFiles('conan.lock', 'conanfile.py', 'recipes/**/conandata.yml', 'conan/profiles/*') }}
        restore-keys: conan-${{ runner.os }}-

    - name: Cache the compiled objects
      if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ github.job }}-
          ccache-${{ runner.os }}-
