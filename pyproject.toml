[project]
name = "voltmod"
version = "1.3.0"
description = "Build and scaffolding tooling for CS2 Metamod:Source plugin projects"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
    "cmake>=4.3.4",
    "conan>=2.29.1",
    "ninja>=1.13.0",
    "clang-format==22.1.5",
    "typer>=0.27.1",
    "pyyaml>=6.0",
]

[project.scripts]
voltmod = "voltmod.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/voltmod"]

# Ship the repository-level scaffold trees beside the Python package.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "voltmod/templates"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "poethepoet>=0.47.0",
    "pytest>=8.4.0",
]


[tool.poe.tasks]
build = "voltmod build"
build-linux = "voltmod build linux-steamrt-release"
test = "voltmod test"
doctor = "voltmod doctor"
new-plugin = "voltmod new-plugin"
lint = ["_ruff", "test-tools"]
_ruff = "ruff check ."

modgraph = "voltmod modgraph"
panorama = "voltmod panorama"
test-tools = "pytest scripts/tests"
format = "voltmod format"

[tool.pytest.ini_options]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["conan"]
