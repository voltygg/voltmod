[project]
name = "voltmod"
version = "1.2.0"
description = "Build and scaffolding tooling for CS2 Metamod:Source plugin projects"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

# Consumers install these dependencies with the CLI and inherit its tool pins.
dependencies = [
    "cmake>=4.3.4",
    "conan>=2.29.1",
    "ninja>=1.13.0",
    "clang-format==22.1.5",
    # `voltmod package` reads recipe conandata files.
    "pyyaml>=6.0",
]

[project.scripts]
voltmod = "voltmod.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/voltmod"]

# Ship the repository-level scaffold trees beside the Python package.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "voltmod/templates"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "poethepoet>=0.47.0",
]

# Task aliases for the voltmod CLI.
[tool.poe.tasks]
build = "voltmod build"
build-linux = "voltmod build linux-steamrt-release"
# Run from the consumer root; creates `plugins/<name>` there.
new-plugin = "voltmod new-plugin"
lint = "ruff check ."
# Enforce the module include allowlist.
modgraph = "voltmod modgraph"
format = "voltmod format"
format-check = "voltmod format --check"

[tool.ruff]
line-length = 100
target-version = "py314"
# Templates contain placeholders and should not receive a Ruff cache.
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
# The sibling `conan/` directory is not the Python package.
known-third-party = ["conan"]
