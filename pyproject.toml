[project]
name = "voltmod"
version = "1.5.3"
description = "Build and scaffolding tooling for CS2 Metamod:Source plugin projects"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
    "cmake>=4.3.4",
    "conan>=2.29.1",
    "ninja>=1.13.0",
    "clang-format==22.1.5",
    "jinja2>=3.1",
    # sqlpp23-ddl2cpp runs under this interpreter and needs pyparsing.
    "pyparsing>=3.3",
    "python-dotenv>=1.2.0",
    "typer>=0.27.1",
]

[project.scripts]
voltmod = "voltmod.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli/voltmod"]

# Ship the repository-level trees the CLI reads beside the Python package.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "voltmod/bundled/templates"
"panorama" = "voltmod/bundled/panorama"

[dependency-groups]
dev = ["ruff>=0.14.0", "poethepoet>=0.47.0", "pytest>=8.4.0"]


[tool.poe.tasks]
build = "voltmod build"
build-linux = "voltmod build linux-steamrt-release"
test = "voltmod test"
doctor = "voltmod doctor"
new-plugin = "voltmod new-plugin"
lint = ["_ruff", "test-tools"]
_ruff = "ruff check ."

modgraph = "voltmod modgraph"
panorama = "voltmod panorama compile"
test-tools = "pytest cli/tests"
format = "voltmod format"
release = "python -m tools.release"

[tool.pytest.ini_options]
pythonpath = ["cli"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["voltmod", "tools"]
known-third-party = ["conan"]

[[tool.mypy.overrides]]
module = ["conan.*", "yaml"]
ignore_missing_imports = true
